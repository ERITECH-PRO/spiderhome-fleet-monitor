<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <style>
            .line-white { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
            .node-white { fill: #ffffff; stroke: #ffffff; stroke-width: 4; }
            .node-solid { fill: #ffffff; }
            .accent-red { fill: none; stroke: #ff3b5c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
            .accent-blue { fill: none; stroke: #00bfff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
            .fill-red { fill: #ff3b5c; }
            .fill-blue { fill: #00bfff; }
            .text-home { fill: #ffffff; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 42px; font-weight: 800; }
            .text-spider { fill: #ffffff; font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 38px; font-weight: 800; letter-spacing: 6px; }
        </style>
    </defs>

    <!-- Fond bleu nuit très sombre -->
    <rect width="100%" height="100%" fill="#0a1128" />

    <!-- Center alignment offset -->
    <g transform="translate(40, 30)">
        
        <!-- House Outline -->
        <path class="line-white" d="M 20 140 L 130 50 L 260 50 L 330 80" />
        <rect class="line-white" x="75" y="30" width="25" height="50" fill="none" />
        
        <!-- Top Left Smart Icon -->
        <path d="M 155 60 L 175 60 A 10 10 0 0 1 185 70 L 185 80 L 155 80 Z" class="fill-red" />
        <path d="M 190 60 L 210 60 A 10 10 0 0 1 220 70 L 220 80 L 190 80 Z" class="fill-blue" />
        <path d="M 155 85 L 185 85 L 185 115 A 10 10 0 0 1 175 125 L 155 125 Z" fill="#ffffff" />
        
        <!-- Right Wifi & Camera Icons -->
        <path class="accent-blue" stroke-width="6" d="M 330 80 A 40 40 0 0 1 350 40" />
        <path class="accent-blue" stroke-width="6" d="M 350 100 A 50 50 0 0 1 380 50" />
        
        <rect x="375" y="85" width="45" height="20" rx="10" class="fill-blue" />
        <circle cx="388" cy="95" r="4" fill="#ffffff" />
        
        <!-- Typograpghy -->
        <text x="320" y="145" class="text-home">HOME</text>
        <g transform="translate(370, 160)">
            <text x="0" y="0" class="text-spider" transform="rotate(90)">SPIDER</text>
        </g>
        
        <!-- Middle section: The Spider Circuit -->
        <g transform="translate(30, 20)">
            <!-- Top nodes (Spider eyes/antennae) -->
            <path class="line-white" d="M 125 150 L 125 90" />
            <circle cx="125" cy="90" r="8" class="node-white" />
            
            <path class="line-white" d="M 235 150 L 235 90" />
            <circle cx="235" cy="90" r="8" class="node-white" />
            
            <!-- Center Red Lightbulb -->
            <path class="accent-red" d="M 160 140 A 20 20 0 1 1 200 140 L 200 160 L 160 160 Z" />
            <line class="accent-red" x1="165" y1="165" x2="195" y2="165" />
            <line class="accent-red" x1="170" y1="170" x2="190" y2="170" />
            <path class="accent-red" stroke-width="2" d="M 170 145 L 180 120 L 190 145" />
            
            <!-- Radial red strokes around bulb -->
            <line class="accent-red" x1="180" y1="95" x2="180" y2="110" />
            <line class="accent-red" x1="145" y1="110" x2="155" y2="120" />
            <line class="accent-red" x1="215" y1="110" x2="205" y2="120" />
            <line class="accent-red" x1="135" y1="140" x2="150" y2="140" />
            <line class="accent-red" x1="225" y1="140" x2="210" y2="140" />
            
            <!-- Hexagonal/Circular Core -->
            <circle cx="180" cy="220" r="35" class="line-white" />
            <circle cx="180" cy="220" r="20" class="line-white" stroke-dasharray="6 6" />
            <circle cx="180" cy="220" r="6" class="node-solid" />
            
            <line class="line-white" x1="180" y1="175" x2="180" y2="185" />
            <line class="line-white" x1="180" y1="255" x2="180" y2="295" />
            
            <path class="line-white" d="M 120 250 A 65 65 0 0 0 240 250" />
            
            <!-- Bottom CPU -->
            <circle cx="180" cy="330" r="35" class="line-white" />
            <rect x="165" y="315" width="30" height="30" class="accent-blue" />
            <!-- CPU Pins -->
            <path class="accent-blue" stroke-width="2" d="M 170 310 v 5 M 180 310 v 5 M 190 310 v 5" />
            <path class="accent-blue" stroke-width="2" d="M 170 345 v 5 M 180 345 v 5 M 190 345 v 5" />
            <path class="accent-blue" stroke-width="2" d="M 160 320 h 5 M 160 330 h 5 M 160 340 h 5" />
            <path class="accent-blue" stroke-width="2" d="M 195 320 h 5 M 195 330 h 5 M 195 340 h 5" />
            
            <!-- Legs Left Side -->
            <path class="line-white" d="M 140 150 L 90 150 L 90 100" />
            <circle cx="90" cy="100" r="8" class="node-white" />
            
            <path class="line-white" d="M 125 180 L 80 180 L 50 210" />
            <circle cx="50" cy="210" r="8" class="node-white" />
            
            <path class="line-white" d="M 110 210 L 70 230 L 70 280" />
            <circle cx="70" cy="280" r="8" class="node-white" />
            
            <path class="line-white" d="M 100 240 L 40 260 L 20 310" />
            <circle cx="20" cy="310" r="8" class="node-white" />
            
            <!-- Legs Right Side -->
            <path class="line-white" d="M 220 150 L 270 150 L 270 100" />
            <circle cx="270" cy="100" r="8" class="node-white" />
            
            <path class="line-white" d="M 235 180 L 280 180 L 310 210" />
            <circle cx="310" cy="210" r="8" class="node-white" />
            
            <path class="line-white" d="M 250 210 L 290 230 L 290 280" />
            <circle cx="290" cy="280" r="8" class="node-white" />
            
            <path class="line-white" d="M 260 240 L 320 260 L 340 310" />
            <circle cx="340" cy="310" r="8" class="node-white" />
        </g>
    </g>
</svg>
